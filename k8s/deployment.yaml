apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: default          # <-- yeh line add kar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
      - name: flask
        image: iamabhinandanpatil/flask-gitops-app:v3
        ports:
        - containerPort: 5000